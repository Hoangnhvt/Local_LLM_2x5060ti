# Qwen3.6-27B-Text NVFP4-MTP (sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP)
#
# Native FP4 (modelopt path) on Blackwell (SM 120). Tensor-parallel across both 5060 Ti.
# Vision tower stripped. MTP speculative decoding: +1.74× throughput vs baseline.
# Requires vLLM >= 0.19 — bump VLLM_IMAGE in .env before launching.
#
# VRAM budget (per 16 GB GPU, TP=2):
#   weights ~9.85 GB + MTP head ~0.43 GB + runtime ~1.5 GB → ~4.2 GB headroom for KV @ FP8
#   Hybrid arch: only 16/64 layers are full-attention (GQA, 4 KV heads)
#   → KV ≈ 8 KB/token/GPU
#   → 64K context × 4 seqs = ~2 GB/GPU  ← concurrency=4 ceiling on this hardware
#   → 128K context × 4 seqs = ~4 GB/GPU (OOM with CUDA graphs, use --enforce-eager)
#
# Perf expectation on this hardware: ~40-70 tok/s decode w/ MTP (PCIe 3.0 x8/x8, no NVLink).
services:
  vllm-coder-lg-nvfp4-mtp:
    image: ${VLLM_IMAGE_NVFP4:-vllm/vllm-openai:nightly}
    container_name: vllm-coder-lg-nvfp4-mtp
    restart: unless-stopped
    networks: [brain]
    ipc: host
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: all
    environment:
      HF_HOME: /models/.cache
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      NCCL_P2P_DISABLE: "1"          # 5060 Ti has no P2P over PCIe
      NCCL_IB_DISABLE: "1"
      VLLM_USE_V1: "1"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models
    command:
      - --model=/models/coder-lg-nvfp4-mtp
      - --served-model-name=Qwen3.6-27B-Text-NVFP4-MTP
      - --tensor-parallel-size=2
      - --quantization=modelopt
      - --language-model-only
      - --max-model-len=${NVFP4_MAX_LEN:-65536}
      - --max-num-seqs=${NVFP4_MAX_SEQS:-4}
      - --kv-cache-dtype=fp8
      - --gpu-memory-utilization=${GPU_MEM_UTIL:-0.92}
      - '--speculative-config={"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      # For 128K context push: set NVFP4_MAX_LEN=131072 NVFP4_MAX_SEQS=2, add --enforce-eager manually
      - --uvicorn-log-level=info
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_xml
      - --enable-auto-tool-choice
      - --trust-remote-code
      - --port=8000
      - --host=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\").read()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 300s

networks:
  brain:
    external: true
    name: kurts-brain_brain
