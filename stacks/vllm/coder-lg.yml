# Qwen2.5-Coder-32B AWQ — tensor parallel across both 5060 Ti.
# Eats both GPUs. Do not co-load with another vLLM service.
services:
  vllm-coder-lg:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.8.5}
    container_name: vllm-coder-lg
    restart: unless-stopped
    networks: [brain]
    ipc: host                       # required for NCCL shm
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: all
    environment:
      HF_HOME: /models/.cache
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      NCCL_P2P_DISABLE: "1"         # 5060 Ti has no P2P over PCIe — saves a startup probe
      NCCL_IB_DISABLE: "1"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models
    command:
      - --model=/models/coder-lg
      - --served-model-name=Qwen2.5-Coder-32B-Instruct-AWQ
      - --tensor-parallel-size=2
      - --quantization=awq_marlin
      - --dtype=float16
      - --max-model-len=${MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization=${GPU_MEM_UTIL:-0.92}
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --port=8000
      - --host=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/health\").read()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
